// ==================== 工具函数 ====================
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function rectCircleCollide(rect,cx,cy,cr){
    let closestX=Math.max(rect.x,Math.min(cx,rect.x+rect.w));
    let closestY=Math.max(rect.y,Math.min(cy,rect.y+rect.h));
    let dx=cx-closestX,dy=cy-closestY;
    return(dx*dx+dy*dy)<(cr*cr);
}
function closeAllModals(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');}

// ==================== 音频 ====================
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playBGM(){
    if(!audioCtx)return;
    if(bgmOscillator)bgmOscillator.stop();
    bgmOscillator=audioCtx.createOscillator();
    const gainNode=audioCtx.createGain();
    bgmOscillator.type='sine';bgmOscillator.frequency.value=220;
    gainNode.gain.value=(audioSettings.bgmVolume/100)*0.05;
    bgmOscillator.connect(gainNode);gainNode.connect(audioCtx.destination);bgmOscillator.start();
}
function stopBGM(){if(bgmOscillator){bgmOscillator.stop();bgmOscillator=null;}}
function playSearchMusic(){
    if(!audioCtx)return;
    if(searchMusicOscillator)searchMusicOscillator.stop();
    searchMusicOscillator=audioCtx.createOscillator();
    const gainNode=audioCtx.createGain();
    searchMusicOscillator.type='triangle';searchMusicOscillator.frequency.value=330;
    gainNode.gain.value=(audioSettings.searchMusicVolume/100)*0.04;
    searchMusicOscillator.connect(gainNode);gainNode.connect(audioCtx.destination);searchMusicOscillator.start();
    setTimeout(()=>{if(searchMusicOscillator){searchMusicOscillator.stop();searchMusicOscillator=null;}},2000);
}

function getTotalBackpackSlots(){return Math.min(MAX_BACKPACK_SLOTS,20+researchBackpackBonus+videoBackpackBonus);}
function addItemToInventory(item){
    const existing=playerInventory.find(i=>i.type===item.type);
    if(existing){existing.amount+=item.amount;return true;}
    if(playerInventory.length>=player.maxInventorySlots){alert('背包已满！');return false;}
    playerInventory.push({...item});return true;
}
function watchAdForBackpack(){
    if(hasWatchedBackpackAdThisMatch){alert('本对局已看过扩容视频，请下一局再试');return;}
    if(getTotalBackpackSlots()>=MAX_BACKPACK_SLOTS){alert('背包已达100格');return;}

}

function initGlobalLootPool(){
    globalLootPool=[];
    specialRedItems.forEach(item=>{globalLootPool.push({type:'大红变卖物',name:item.name,color:item.color,icon:item.icon,amount:1,price:item.price});});
    function addItems(rarity,count){
        const names=lootNamesByRarity[rarity]||[];
        for(let i=0;i<count;i++){
            const randomName=names[Math.floor(Math.random()*names.length)]||'未知物品';
            globalLootPool.push({type:rarity,name:randomName,amount:1});
        }
    }
    addItems('红色变卖物',80);addItems('金色变卖物',70);addItems('黄色变卖物',60);
    addItems('蓝色变卖物',50);addItems('绿色变卖物',36);
    for(let i=globalLootPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[globalLootPool[i],globalLootPool[j]]=[globalLootPool[j],globalLootPool[i]];}
}
function drawFromLootPool(count){
    const items=[];
    for(let i=0;i<count;i++){if(globalLootPool.length===0)break;items.push(globalLootPool.pop());}
    return items;
}

function getRandomExit(mapIndex){
    let attempts=0,x,y;
    do{x=50+Math.random()*(LOGIC_W-100);y=50+Math.random()*(LOGIC_H-100);attempts++;}
    while(attempts<200&&(distance({x,y},{x:80,y:520})<200||obstacles.some(o=>rectCircleCollide(o,x,y,EXIT_RADIUS+5))));
    return{x,y};
}

// ==================== 初始化对局 ====================
function initGame(charIndex,mapIndex){
    const ch=characters[charIndex];
    const charLevel=characterLevels[charIndex]||1;
    const levelBonus={health:(charLevel-1)*2,speed:(charLevel-1)*0.01,damage:(charLevel-1)*0.01};
    const healthBonus=researchBonuses.healthBonus;
    const speedBonus=researchBonuses.speedBonus;
    const helmetStats=loadoutStats[equippedLoadout.helmet];
    const armorStats=loadoutStats[equippedLoadout.armor];
    const weaponStats=loadoutStats[equippedLoadout.weapon];
    player={
        x:80,y:520,
        speed:(2.5*(ch.passive.moveSpeed||1)+speedBonus)*(1+levelBonus.speed)*0.9,
        runSpeed:(4.5*(ch.passive.moveSpeed||1)+speedBonus)*(1+levelBonus.speed)*0.9,
        stamina:100,maxStamina:100,
        health:80+healthBonus+levelBonus.health,maxHealth:80+healthBonus+levelBonus.health,
        attackCooldown:(ch.passive.attackCooldown||1),
        attackRange:40*(ch.passive.attackRange||1),
        baseDamage:weaponStats.weaponDamage*(1+levelBonus.damage)*0.8,
        damage:weaponStats.weaponDamage*(1+levelBonus.damage)*0.8,
        defense:ch.passive.defense||1,lifesteal:ch.passive.lifesteal||0,
        helmetDR:helmetStats.helmetDR,armorDR:armorStats.armorDR,stunResist:armorStats.stunResist,
        isStunned:false,stunTimer:0,
        maxAmmo:weaponStats.magSize,ammo:weaponStats.magSize,reloadTime:1.5,reloading:false,reloadTimer:0,
        maxInventorySlots:getTotalBackpackSlots(),
        skillName:ch.skillName,skillCooldown:SKILL_COOLDOWN,
        alive:true,charIndex:charIndex,killCount:0,survivalTime:0,angle:0,isClone:false
    };
    if(mapIndex===10)specialMapUsedDate=new Date().toDateString();
    currentMapIndex=mapIndex;
    obstacles=getMapObstacles(mapIndex);
    exit=getRandomExit(mapIndex);
    dogs=[];for(let i=0;i<MAX_DOGS;i++)dogs.push(createDog());
    bullets=[];boss=spawnBoss(mapIndex);bossDead=false;bossChest=null;
    initGlobalLootPool();
    lootableObjects=generateLootObjects(mapIndex);
    playerInventory=[];clone=null;bananaPeels=[];smokeClouds=[];frostZones=[];
    killStreak=0;damageBoostActive=false;regenTimer=0;stamina=100;maxStamina=100;isSliding=false;slideCooldown=0;
    if(isFirstTime){superMedkitCount=1;normalMedkitCount=1;isFirstTime=false;}else{superMedkitCount=0;normalMedkitCount=0;}
    skillCooldownTimer=0;skillDurationTimer=0;skillActive=false;attackCooldownTimer=0;safeState.active=false;
    hasWatchedBackpackAdThisMatch=false;petActiveTimer=0;
    const petEffect=getPetEffect(equippedPetIndex);
    if(pets[equippedPetIndex].type==='speed'){player.speed*=petEffect.speedMultiplier;player.runSpeed*=petEffect.speedMultiplier;}
    player.petEffect=petEffect;
    gameState='playing';stopBGM();closeAllModals();
}

function createDog(){
    let x,y,attempts=0;
    do{x=Math.random()*(LOGIC_W-100)+50;y=Math.random()*(LOGIC_H-100)+50;attempts++;}
    while(attempts<100&&(distance({x,y},player)<200||obstacles.some(o=>rectCircleCollide(o,x,y,DOG_RADIUS))));
    return{x,y,speed:(2.5+Math.random()*1.5)*1.15,angle:0,state:'patrol',patrolTarget:{x:Math.random()*700+50,y:Math.random()*500+50},detectRange:180+Math.random()*100,attackRange:35,health:5,maxHealth:5,isDead:false,respawnTime:0,frozen:false,frozenTimer:0,slipped:false,slippedTimer:0};
}
function respawnDog(dog){
    let x,y,attempts=0;
    do{x=Math.random()*(LOGIC_W-100)+50;y=Math.random()*(LOGIC_H-100)+50;attempts++;}
    while(attempts<100&&(distance({x,y},player)<250||obstacles.some(o=>rectCircleCollide(o,x,y,DOG_RADIUS))));
    dog.x=x;dog.y=y;dog.health=5;dog.maxHealth=5;dog.isDead=false;dog.state='patrol';dog.patrolTarget={x:Math.random()*700+50,y:Math.random()*500+50};dog.frozen=false;dog.slipped=false;
}
function spawnBoss(mapIndex){
    const type=bossTypes[mapIndex];
    let x,y,attempts=0;
    do{x=Math.random()*(LOGIC_W-100)+50;y=Math.random()*(LOGIC_H-100)+50;attempts++;}
    while(attempts<100&&distance({x,y},player)<300);
    return{...type,x,y,health:type.maxHealth,maxHealth:type.maxHealth,isDead:false,state:'patrol',patrolTarget:{x:Math.random()*700+50,y:Math.random()*500+50},detectRange:250,attackRange:60,attackTimer:0,specialTimer:0,angle:0,frozen:false,frozenTimer:0,slipped:false,slippedTimer:0,homeX:x,homeY:y,homeRadius:200,isReturning:false,healTimer:0,skillTimer:0};
}

        objects.push({type:'bigSafe',x:500,y:400,opened:false,codeLength:4,loot:drawFromLootPool(12)});

        objects.push({type:'bigSafe',x:200,y:200,opened:false,codeLength:4,loot:drawFromLootPool(8)});
        objects.push({type:'bigSafe',x:500,y:300,opened:false,codeLength:4,loot:drawFromLootPool(8)});
        objects.push({type:'smallSafe',x:600,y:150,opened:false,codeLength:3,loot:drawFromLootPool(4)});
        objects.push({type:'smallSafe',x:300,y:400,opened:false,codeLength:3,loot:drawFromLootPool(4)});
        objects.push({type:'medkit',x:400,y:150,opened:false,loot:drawFromLootPool(2)});
    }else{
        objects.push({type:'bigSafe',x:300,y:100,opened:false,codeLength:4,loot:drawFromLootPool(8)});
        objects.push({type:'bigSafe',x:500,y:400,opened:false,codeLength:4,loot:drawFromLootPool(8)});

    objects.push({type:'clothes',x:650,y:350,opened:false,loot:[{type:'衣服',amount:1}]});
    return objects;
}

// ==================== 宠物 ====================
function getPetEffect(index){
    const pet=pets[index];const level=petLevels[index]||1;
    if(pet.type==='speed')return{speedMultiplier:1+(level-1)*0.002};
    if(pet.type==='heal')return{healInterval:Math.max(5,pet.healInterval-(level-1)*0.1),healPercent:pet.healPercent+(level-1)*0.0005};
    if(pet.type==='smoke')return{smokeCooldown:Math.max(5,pet.smokeCooldown-(level-1)*0.2),smokeRadius:pet.smokeRadius+(level-1)*0.5,smokeDuration:pet.smokeDuration};
    return{};
}

// ==================== 伤害 ====================
function damagePlayer(amount,isHeadshot=false,isBullet=false){
    if(!player.alive)return;
    let finalDamage=amount;
    if(isHeadshot)finalDamage*=(1-player.helmetDR);else finalDamage*=(1-player.armorDR);
    player.health-=finalDamage;
    if(player.health<=0){player.health=0;player.alive=false;gameState='dead';}
}

// ==================== 换弹/滑铲 ====================
function startReload(){if(gameState!=='playing'||player.reloading||player.ammo>=player.maxAmmo)return;player.reloading=true;player.reloadTimer=1.5;}
function updateReload(){if(player.reloading){player.reloadTimer-=0.016;if(player.reloadTimer<=0){player.reloading=false;player.ammo=player.maxAmmo;}}}
function performSlide(){isSliding=true;slideTimer=SLIDE_DURATION;slideCooldown=SLIDE_COOLDOWN;}

// ==================== 射击 ====================
function playerShoot(){
    if(player.reloading||player.ammo<=0)return;
    player.ammo--;
    const angle=player.angle;
    bullets.push({x:player.x+Math.cos(angle)*20,y:player.y+Math.sin(angle)*20,vx:Math.cos(angle)*8,vy:Math.sin(angle)*8,damage:player.damage,radius:3,life:1.5,isPlayerBullet:true});
    if(player.ammo<=0)startReload();
}

// ==================== 技能 ====================
function performSkill(){
    const ch=characters[player.charIndex];const name=ch.skillName;
    skillActive=true;skillDurationTimer=5;
    switch(name){
        case'手榴弹':spawnExplosion(player.x+Math.cos(player.angle)*100,player.y+Math.sin(player.angle)*100,60);break;
        case'烟雾弹':smokeClouds.push({x:player.x,y:player.y,timer:5,radius:80});break;
        case'手炮':spawnExplosion(player.x+Math.cos(player.angle)*80,player.y+Math.sin(player.angle)*80,50);break;
        case'冰霜领域':frostZones.push({x:player.x,y:player.y,timer:5,radius:80});dogs.forEach(d=>{if(!d.isDead&&distance(d,player)<80){d.frozen=true;d.frozenTimer=3;}});if(boss&&!boss.isDead&&distance(boss,player)<80){boss.frozen=true;boss.frozenTimer=3;}break;
        case'白菜投掷':spawnExplosion(player.x+Math.cos(player.angle-0.3)*70,player.y+Math.sin(player.angle-0.3)*70,40);spawnExplosion(player.x+Math.cos(player.angle+0.3)*70,player.y+Math.sin(player.angle+0.3)*70,40);break;
        case'刀盾模式':player.damage=player.baseDamage*1.25;skillDurationTimer=15;break;
        case'分身术':if(!clone){const chHp=50+Math.random()*10;clone={x:player.x+50,y:player.y,health:chHp,maxHealth:chHp,speed:player.speed,attackRange:player.attackRange,damage:player.damage*0.7,timer:15,alive:true,angle:0,isClone:true};}skillDurationTimer=15;break;
        case'香蕉皮':bananaPeels.push({x:player.x+Math.cos(player.angle)*40,y:player.y+Math.sin(player.angle)*40,timer:5});break;
        case'巡飞弹':for(let i=0;i<4;i++){const angle=player.angle+(i-1.5)*0.3;spawnExplosion(player.x+Math.cos(angle)*90,player.y+Math.sin(angle)*90,45);}break;
        case'双枪射击':dogs.forEach(d=>{if(!d.isDead&&distance(d,player)<150){d.health-=player.damage*0.6;if(d.health<=0){d.isDead=true;d.respawnTime=RESPAWN_DELAY;player.killCount++;checkKillStreak();}}});if(boss&&!boss.isDead&&distance(boss,player)<150){boss.health-=player.damage*0.5;if(boss.health<=0){boss.health=0;boss.isDead=true;player.killCount+=10;checkKillStreak();}}break;
    }
    skillCooldownTimer=SKILL_COOLDOWN;
}
function spawnExplosion(x,y,radius){
    dogs.forEach(d=>{if(!d.isDead&&distance(d,{x,y})<radius){d.health-=player.damage;if(d.health<=0){d.isDead=true;d.respawnTime=RESPAWN_DELAY;player.killCount++;checkKillStreak();}}});
    if(boss&&!boss.isDead&&distance(boss,{x,y})<radius){boss.health-=player.damage;if(boss.health<=0){boss.health=0;boss.isDead=true;player.killCount+=10;checkKillStreak();taskProgress.totalBossKills++;}}
}
function checkKillStreak(){killStreak++;if(killStreak>=7&&!damageBoostActive){damageBoostActive=true;player.damage*=1.5;setTimeout(()=>{damageBoostActive=false;player.damage/=1.5;killStreak=0;},10000);}}

// ==================== Boss技能 ====================
function performBossSkill(b){
    switch(b.skillName){
        case'召唤修狗':for(let i=0;i<2;i++){const nd=createDog();nd.x=b.x+(Math.random()-0.5)*100;nd.y=b.y+(Math.random()-0.5)*100;dogs.push(nd);}break;
        case'疯狂扫射':for(let i=0;i<5;i++){const a=b.angle+(i-2)*0.2;spawnBossBullet(b.x,b.y,a,b.bulletSpeed*1.2,b.bulletDamage*0.8);}break;
        case'监禁减速':player.speed*=0.5;player.runSpeed*=0.5;setTimeout(()=>{player.speed=2.5*(characters[player.charIndex].passive.moveSpeed||1)+researchBonuses.speedBonus;player.runSpeed=4.5*(characters[player.charIndex].passive.moveSpeed||1)+researchBonuses.speedBonus;},3000);break;
        case'死亡凝视':spawnBossBullet(b.x,b.y,b.angle,b.bulletSpeed*1.5,b.bulletDamage*2);break;
        case'烟雾掩护':smokeClouds.push({x:b.x,y:b.y,timer:5,radius:120});break;
        case'召唤修狗群':for(let i=0;i<4;i++){const nd=createDog();nd.x=b.x+(Math.random()-0.5)*150;nd.y=b.y+(Math.random()-0.5)*150;nd.health=5;nd.maxHealth=5;dogs.push(nd);}break;
        case'弹幕风暴':for(let i=0;i<8;i++){const a=b.angle+(i-3.5)*0.15;spawnBossBullet(b.x,b.y,a,b.bulletSpeed,b.bulletDamage);}break;
        case'禁锢领域':player.speed*=0.3;player.runSpeed*=0.3;setTimeout(()=>{player.speed=2.5*(characters[player.charIndex].passive.moveSpeed||1)+researchBonuses.speedBonus;player.runSpeed=4.5*(characters[player.charIndex].passive.moveSpeed||1)+researchBonuses.speedBonus;},5000);break;
        case'绝命狙击':spawnBossBullet(b.x,b.y,b.angle,b.bulletSpeed*2,b.bulletDamage*3);break;
        case'毒气弥漫':smokeClouds.push({x:b.x,y:b.y,timer:8,radius:150});break;
        case'狂暴肘击':
            const dx=player.x-b.x,dy=player.y-b.y;const len=Math.hypot(dx,dy)||1;
            player.x=b.x+(dx/len)*80;player.y=b.y+(dy/len)*80;damagePlayer(20);
            break;
    }
}

// ==================== Boss更新 ====================
function updateBoss(){
    const b=boss;
    const distToHome=Math.hypot(b.x-b.homeX,b.y-b.homeY);
    if(distToHome>b.homeRadius){b.isReturning=true;b.healTimer=0;}
    else if(b.isReturning){b.isReturning=false;b.healTimer=0;}
    if(b.isReturning){
        const dx=b.homeX-b.x,dy=b.homeY-b.y;const len=Math.hypot(dx,dy);
        if(len>0){const mx=(dx/len)*b.speed*1.5,my=(dy/len)*b.speed*1.5;let nx=b.x+mx,ny=b.y+my;
            if(nx-35>0&&nx+35<LOGIC_W&&!obstacles.some(o=>rectCircleCollide(o,nx,b.y,35)))b.x=nx;
            if(ny-35>0&&ny+35<LOGIC_H&&!obstacles.some(o=>rectCircleCollide(o,b.x,ny,35)))b.y=ny;}
        b.state='returning';return;
    }
    b.healTimer+=0.016;if(b.healTimer>=10){b.health=b.maxHealth;b.healTimer=0;}
    let distToPlayer=distance(b,player);
    let inSmoke=smokeClouds.some(s=>distance(b,s)<s.radius);
    if(distToPlayer<b.detectRange&&!inSmoke)b.state='chase';else b.state='patrol';
    b.skillTimer-=0.016;
    if(b.skillTimer<=0&&b.state==='chase'){performBossSkill(b);b.skillTimer=b.skillCooldown;}
    if(b.state==='chase'){
        b.angle=Math.atan2(player.y-b.y,player.x-b.x);
        if(b.name==='蕾斯'){
            if(distToPlayer<b.meleeRange){
                b.skillTimer-=0.016;
                if(b.skillTimer<=0){const dx=player.x-b.x,dy=player.y-b.y;const len=Math.hypot(dx,dy)||1;player.x=b.x+(dx/len)*80;player.y=b.y+(dy/len)*80;damagePlayer(20);b.skillTimer=b.skillCooldown;}
            }else{b.attackTimer-=0.016;if(b.attackTimer<=0){bossShoot(b);b.attackTimer=b.attackInterval;}}
        }else{
            if(distToPlayer>150){const dx=player.x-b.x,dy=player.y-b.y;const len=Math.hypot(dx,dy);if(len>0){let nx=b.x+(dx/len)*b.speed,ny=b.y+(dy/len)*b.speed;
                if(nx-35>0&&nx+35<LOGIC_W&&!obstacles.some(o=>rectCircleCollide(o,nx,b.y,35)))b.x=nx;
                if(ny-35>0&&ny+35<LOGIC_H&&!obstacles.some(o=>rectCircleCollide(o,b.x,ny,35)))b.y=ny;}}
            b.attackTimer-=0.016;
            if(b.attackTimer<=0){bossShoot(b);if(b.special==='breather'){if(b.specialTimer<=0){b.attackTimer=b.attackInterval;b.specialTimer=3;}else{b.attackTimer=2;b.specialTimer=0;}}else{b.attackTimer=b.attackInterval;}}
            if(distToPlayer<b.attackRange){damagePlayer(15);}
        }
    }else{
        const dx=b.patrolTarget.x-b.x,dy=b.patrolTarget.y-b.y;const len=Math.hypot(dx,dy);
        if(len<30){b.patrolTarget={x:Math.random()*700+50,y:Math.random()*500+50};}
        else{let nx=b.x+(dx/len)*b.speed*0.5,ny=b.y+(dy/len)*b.speed*0.5;
            if(nx-35>0&&nx+35<LOGIC_W&&!obstacles.some(o=>rectCircleCollide(o,nx,b.y,35)))b.x=nx;
            if(ny-35>0&&ny+35<LOGIC_H&&!obstacles.some(o=>rectCircleCollide(o,b.x,ny,35)))b.y=ny;b.angle=Math.atan2(dy,dx);}
    }
}
function bossShoot(b){
    if(b.special==='rapid'){const a=b.angle,off=0.15;spawnBossBullet(b.x,b.y,a-off,b.bulletSpeed,b.bulletDamage);spawnBossBullet(b.x,b.y,a+off,b.bulletSpeed,b.bulletDamage);}
    else spawnBossBullet(b.x,b.y,b.angle,b.bulletSpeed,b.bulletDamage);
}
function spawnBossBullet(x,y,angle,speed,damage){bullets.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,damage,radius:5,life:3,isPlayerBullet:false});}

// ==================== 更新 ====================
function update(){
    if(gameState!=='playing')return;
    if(!player.alive)return;
    const ch=characters[player.charIndex];
    if(ch.passive.regen){regenTimer+=0.016;if(regenTimer>=20){regenTimer=0;player.health=Math.min(player.maxHealth,player.health+5);}}
    updateReload();
    stamina=Math.min(maxStamina,stamina+STAMINA_REGEN*0.016);
    let moveX=0,moveY=0;
    if(keys['w'])moveY=-1;if(keys['s'])moveY=1;if(keys['a'])moveX=-1;if(keys['d'])moveX=1;
    if(joyActive){moveX=joyVector.x;moveY=joyVector.y;}
    let inputMag=Math.hypot(moveX,moveY);if(inputMag>1)inputMag=1;
    let wantRun=(keys['shift']||runPressed)&&stamina>0;
    if(joyActive&&inputMag>0.9&&stamina>0)wantRun=true;
    let currentSpeed=wantRun?player.runSpeed:player.speed;
    if(wantRun)stamina=Math.max(0,stamina-RUN_STAMINA_DRAIN*0.016);
    if(slideCooldown>0)slideCooldown-=0.016;
    if(isSliding){slideTimer-=0.016;if(slideTimer<=0)isSliding=false;currentSpeed*=1.5;}
    if(moveX!==0||moveY!==0){const len=Math.hypot(moveX,moveY);moveX/=len;moveY/=len;player.angle=Math.atan2(moveY,moveX);}
    let newX=player.x+moveX*currentSpeed,newY=player.y+moveY*currentSpeed;
    let canMoveX=true,canMoveY=true;
    if(newX-PLAYER_RADIUS<0||newX+PLAYER_RADIUS>LOGIC_W)canMoveX=false;
    if(newY-PLAYER_RADIUS<0||newY+PLAYER_RADIUS>LOGIC_H)canMoveY=false;
    for(let obs of obstacles){if(rectCircleCollide(obs,newX,player.y,PLAYER_RADIUS))canMoveX=false;if(rectCircleCollide(obs,player.x,newY,PLAYER_RADIUS))canMoveY=false;}
    if(canMoveX)player.x=newX;if(canMoveY)player.y=newY;
    if((keys['attack']||attackPressed)&&attackCooldownTimer<=0&&!player.reloading){playerShoot();attackCooldownTimer=player.attackCooldown;}
    if(attackCooldownTimer>0)attackCooldownTimer-=0.016;
    if((keys['skill']||skillPressed)&&skillCooldownTimer<=0){performSkill();skillCooldownTimer=player.skillCooldown;}
    if(skillCooldownTimer>0)skillCooldownTimer-=0.016;
    if(skillDurationTimer>0){skillDurationTimer-=0.016;if(skillDurationTimer<=0){skillActive=false;player.damage=player.baseDamage;}}
    if(keys['interact']||interactPressed){handleInteract();keys['interact']=false;interactPressed=false;}
    // 宠物主动效果
    const pe=player.petEffect;
    if(pe&&pe.healInterval){petActiveTimer+=0.016;if(petActiveTimer>=pe.healInterval){petActiveTimer=0;player.health=Math.min(player.maxHealth,player.health+player.maxHealth*pe.healPercent);}}
    if(pe&&pe.smokeCooldown){petActiveTimer+=0.016;if(petActiveTimer>=pe.smokeCooldown){petActiveTimer=0;smokeClouds.push({x:player.x,y:player.y,timer:pe.smokeDuration||5,radius:pe.smokeRadius||100});}}
    if(clone){clone.timer-=0.016;if(clone.timer<=0||clone.health<=0)clone=null;}
    for(let i=bananaPeels.length-1;i>=0;i--){bananaPeels[i].timer-=0.016;if(bananaPeels[i].timer<=0)bananaPeels.splice(i,1);}
    for(let i=smokeClouds.length-1;i>=0;i--){smokeClouds[i].timer-=0.016;if(smokeClouds[i].timer<=0)smokeClouds.splice(i,1);}
    for(let i=frostZones.length-1;i>=0;i--){frostZones[i].timer-=0.016;if(frostZones[i].timer<=0)frostZones.splice(i,1);}
    if(distance(player,exit)<EXIT_RADIUS){gameState='evacuated';return;}
    if(boss&&!boss.isDead){if(boss.frozen){boss.frozenTimer-=0.016;if(boss.frozenTimer<=0)boss.frozen=false;}else updateBoss();}
    else if(boss&&boss.isDead&&!bossChest){bossChest={type:'bossChest',x:boss.x,y:boss.y,opened:false,loot:drawFromLootPool(15)};lootableObjects.push(bossChest);}
    updateBullets();
    for(let dog of dogs){
        if(dog.isDead){dog.respawnTime-=0.016;if(dog.respawnTime<=0)respawnDog(dog);continue;}
        if(dog.frozen){dog.frozenTimer-=0.016;if(dog.frozenTimer<=0)dog.frozen=false;continue;}
        if(dog.slipped){dog.slippedTimer-=0.016;if(dog.slippedTimer<=0)dog.slipped=false;continue;}
        let distToPlayer=distance(dog,player);
        let inSmoke=smokeClouds.some(s=>distance(dog,s)<s.radius);
        if(distToPlayer<dog.detectRange&&!inSmoke)dog.state='chase';else dog.state='patrol';
        for(let peel of bananaPeels){if(distance(dog,peel)<20&&!dog.slipped){dog.slipped=true;dog.slippedTimer=2;}}
        if(dog.state==='chase'){
            let dx=player.x-dog.x,dy=player.y-dog.y;let len=Math.hypot(dx,dy);if(len>0){dx/=len;dy/=len;}
            let nx=dog.x+dx*dog.speed,ny=dog.y+dy*dog.speed;
            let canX=true,canY=true;
            if(nx-DOG_RADIUS<0||nx+DOG_RADIUS>LOGIC_W)canX=false;
            if(ny-DOG_RADIUS<0||ny+DOG_RADIUS>LOGIC_H)canY=false;
            for(let obs of obstacles){if(rectCircleCollide(obs,nx,dog.y,DOG_RADIUS))canX=false;if(rectCircleCollide(obs,dog.x,ny,DOG_RADIUS))canY=false;}
            if(canX)dog.x=nx;if(canY)dog.y=ny;dog.angle=Math.atan2(dy,dx);
            if(distToPlayer<dog.attackRange){damagePlayer(15);}
        }else{
            let dx=dog.patrolTarget.x-dog.x,dy=dog.patrolTarget.y-dog.y;let len=Math.hypot(dx,dy);
            if(len<20){dog.patrolTarget={x:Math.random()*700+50,y:Math.random()*500+50};}
            else{dx/=len;dy/=len;let nx=dog.x+dx*dog.speed*0.5,ny=dog.y+dy*dog.speed*0.5;
                let canX=true,canY=true;
                if(nx-DOG_RADIUS<0||nx+DOG_RADIUS>LOGIC_W)canX=false;
                if(ny-DOG_RADIUS<0||ny+DOG_RADIUS>LOGIC_H)canY=false;
                for(let obs of obstacles){if(rectCircleCollide(obs,nx,dog.y,DOG_RADIUS))canX=false;if(rectCircleCollide(obs,dog.x,ny,DOG_RADIUS))canY=false;}
                if(canX)dog.x=nx;if(canY)dog.y=ny;dog.angle=Math.atan2(dy,dx);}
        }
    }
    if(player.alive)player.survivalTime+=0.016;
}
function updateBullets(){
    for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life-=0.016;
        if(b.x<0||b.x>LOGIC_W||b.y<0||b.y>LOGIC_H||b.life<=0){bullets.splice(i,1);continue;}
        let hitObs=obstacles.some(o=>rectCircleCollide(o,b.x,b.y,b.radius));
        if(hitObs){bullets.splice(i,1);continue;}
        if(b.isPlayerBullet){
            for(let dog of dogs){if(!dog.isDead&&distance(b,dog)<b.radius+DOG_RADIUS){dog.health-=b.damage;if(dog.health<=0){dog.isDead=true;dog.respawnTime=RESPAWN_DELAY;player.killCount++;checkKillStreak();}bullets.splice(i,1);break;}}
            if(i>=0&&boss&&!boss.isDead&&distance(b,boss)<b.radius+35){boss.health-=b.damage;if(boss.health<=0){boss.health=0;boss.isDead=true;player.killCount+=10;taskProgress.totalBossKills++;checkKillStreak();}bullets.splice(i,1);}
        }else{
            if(distance(b,player)<b.radius+PLAYER_RADIUS){damagePlayer(b.damage,Math.random()<0.2,true);bullets.splice(i,1);}
        }
    }
}
function handleInteract(){
    let nearest=null;let minDist=100;
    for(let obj of lootableObjects){if(obj.opened)continue;const d=distance(player,obj);if(d<minDist){minDist=d;nearest=obj;}}
    if(nearest){
        if(nearest.type==='bigSafe'||nearest.type==='smallSafe'){if(!nearest.opened){safeModal.style.display='flex';currentInteractTarget=nearest;initSafeWheel(nearest);}}
        else{nearest.opened=true;showLoot(nearest);}
    }
}

// ==================== 保险箱 ====================
function initSafeWheel(safeObj){
    const letters=['A','B','C','D','E','F','G','H'];
    const codeLetters=[];for(let i=0;i<safeObj.codeLength;i++)codeLetters.push(letters[Math.floor(Math.random()*letters.length)]);
    safeState.codeLetters=codeLetters;safeState.currentPosition=0;safeState.targetLetter=codeLetters[0];
    safeState.currentAngle=0;safeState.targetAngle=0;safeState.spinning=false;safeState.active=true;
    updateSafeUI();drawSafeWheel();
}
function updateSafeUI(){
    document.getElementById('safeProgress').textContent=`第${safeState.currentPosition+1}/${safeState.codeLetters.length}位 - 目标字母: ${safeState.targetLetter}`;
    document.getElementById('safeHint').textContent='点击旋转，将绿色字母转到顶部绿色灯光处';
}
function drawSafeWheel(){
    const w=300,h=300;safeWheelCtx.clearRect(0,0,w,h);
    const cx=w/2,cy=h/2,radius=120;
    safeWheelCtx.beginPath();safeWheelCtx.arc(cx,cy,radius,0,Math.PI*2);safeWheelCtx.fillStyle='#333';safeWheelCtx.fill();
    safeWheelCtx.strokeStyle='#666';safeWheelCtx.lineWidth=3;safeWheelCtx.stroke();
    const letters=['A','B','C','D','E','F','G','H'];
    for(let i=0;i<letters.length;i++){
        const angle=(i/letters.length)*Math.PI*2+safeState.currentAngle;
        const lx=cx+Math.cos(angle)*(radius-30),ly=cy+Math.sin(angle)*(radius-30);
        if(letters[i]===safeState.targetLetter){safeWheelCtx.fillStyle='#00ff00';safeWheelCtx.shadowColor='#00ff00';safeWheelCtx.shadowBlur=20;}
        else{safeWheelCtx.fillStyle='#fff';safeWheelCtx.shadowBlur=0;}
        safeWheelCtx.font='24px Arial';safeWheelCtx.textAlign='center';safeWheelCtx.textBaseline='middle';
        safeWheelCtx.fillText(letters[i],lx,ly);safeWheelCtx.shadowBlur=0;
    }
    const lightX=cx,lightY=cy-radius;
    safeWheelCtx.fillStyle='#00ff00';safeWheelCtx.shadowColor='#00ff00';safeWheelCtx.shadowBlur=15;
    safeWheelCtx.beginPath();safeWheelCtx.arc(lightX,lightY,10,0,Math.PI*2);safeWheelCtx.fill();safeWheelCtx.shadowBlur=0;
    safeWheelCtx.strokeStyle='rgba(0,255,0,0.3)';safeWheelCtx.lineWidth=2;
    safeWheelCtx.beginPath();safeWheelCtx.moveTo(lightX,lightY);safeWheelCtx.lineTo(cx,cy);safeWheelCtx.stroke();
    const normalizedAngle=((safeState.currentAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const diff=Math.abs(normalizedAngle);
    if(diff<0.1||diff>Math.PI*2-0.1){safeWheelCtx.fillStyle='#00ff00';safeWheelCtx.font='16px Arial';safeWheelCtx.fillText('✓ 已对准',cx,cy+40);}
}
function spinSafeWheel(){
    if(safeState.spinning)return;
    safeState.spinning=true;
    const rotations=Math.floor(Math.random()*3)+1;
    const targetAngle=safeState.currentAngle+rotations*Math.PI*2+Math.random()*Math.PI*2;
    const startAngle=safeState.currentAngle,startTime=Date.now(),duration=2000;
    const interval=setInterval(()=>{
        const progress=Math.min((Date.now()-startTime)/duration,1);
        const eased=1-Math.pow(1-progress,3);
        safeState.currentAngle=startAngle+(targetAngle-startAngle)*eased;
        drawSafeWheel();
        if(progress>=1){clearInterval(interval);safeState.spinning=false;checkAlignment();}
    },16);
}
function checkAlignment(){
    const letters=['A','B','C','D','E','F','G','H'];
    const normalizedAngle=((safeState.currentAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const indexAtTop=Math.round(normalizedAngle/(Math.PI*2/letters.length))%letters.length;
    const letterAtTop=letters[indexAtTop];
    if(letterAtTop===safeState.targetLetter){
        safeState.currentPosition++;
        if(safeState.currentPosition>=safeState.codeLetters.length){
            safeModal.style.display='none';
            if(currentInteractTarget){currentInteractTarget.opened=true;showLoot(currentInteractTarget);}
            safeState.active=false;
        }else{safeState.targetLetter=safeState.codeLetters[safeState.currentPosition];updateSafeUI();drawSafeWheel();}
    }else{updateSafeUI();drawSafeWheel();}
}

// ==================== 研究/打造/宠物/任务 ====================
function upgradeResearch(){
    if(researchLevel>=100){alert('研究已达最高等级');return;}
    if(dogCoins>=researchCost){
        dogCoins-=researchCost;researchLevel++;
        researchBonuses.healthBonus+=10;researchBonuses.speedBonus+=0.2;
        if(researchLevel<=80&&researchLevel%10===0)researchBackpackBonus+=5;
        researchCost=Math.floor(researchCost*1.5);
        alert(`研究升级成功！Lv.${researchLevel}`);
    }else alert('修狗币不足');
}
function buyLoadout(slot,level){
    const cost=loadoutCost[level];
    if(dogCoins>=cost){dogCoins-=cost;equippedLoadout[slot]=level;alert(`已购买${level}品质`);}else alert('修狗币不足');
}
function buyRainbowLoadout(slot){
    if(equippedLoadout[slot]==='炫彩'){alert('已是炫彩');return;}
    if(dogCoins<5000000||playerInventory.filter(i=>i.type==='红色变卖物'||i.type==='大红变卖物').reduce((s,i)=>s+i.amount,0)<5){alert('需要500万修狗币和5个红色/大红变卖物');return;}
    dogCoins-=5000000;let toRemove=5;
    playerInventory=playerInventory.map(item=>{if((item.type==='红色变卖物'||item.type==='大红变卖物')&&toRemove>0){const taken=Math.min(toRemove,item.amount);item.amount-=taken;toRemove-=taken;}return item;}).filter(i=>i.amount>0);
    equippedLoadout[slot]='炫彩';alert('打造炫彩成功！');
}
function craftToRainbow(slot){
    const level=equippedLoadout[slot];
    if(level==='炫彩'){alert('已是炫彩');return;}
    const cost=craftCosts[level];
    if(!cost){alert('无法打造');return;}
    const mat=playerInventory.find(i=>i.type===cost.material);
    if(dogCoins<cost.coins||!mat||mat.amount<cost.materialCount){alert(`需要${cost.coins}币和${cost.materialCount}个${cost.material}`);return;}
    dogCoins-=cost.coins;let remaining=cost.materialCount;
    playerInventory=playerInventory.map(i=>{if(i.type===cost.material&&remaining>0){const taken=Math.min(remaining,i.amount);i.amount-=taken;remaining-=taken;}return i;}).filter(i=>i.amount>0);
    equippedLoadout[slot]='炫彩';alert('打造成功！');
}
function upgradeCharacter(index){
    const lv=characterLevels[index]||1;
    if(lv>=MAX_LEVEL){alert('已满级');return;}
    const cost=1000*Math.pow(1.5,lv-1);
    if(dogCoins>=cost){dogCoins-=cost;characterLevels[index]=lv+1;alert(`${characters[index].name}升到${lv+1}级`);}else alert('修狗币不足');
}
function upgradePet(index){
    const lv=petLevels[index]||1;
    if(lv>=MAX_LEVEL){alert('宠物已满级');return;}
    const cost=800*Math.pow(1.4,lv-1);
    if(dogCoins>=cost){dogCoins-=cost;petLevels[index]=lv+1;alert(`${pets[index].name}升到${lv+1}级`);}else alert('修狗币不足');
}
function updateTaskUI(){
    const container=document.getElementById('taskList');container.innerHTML='';
    taskDefinitions.forEach(task=>{
        const current=taskProgress[task.progressKey]||0;
        const done=current>=task.target;const claimed=claimedTasks[task.id];
        const div=document.createElement('div');
        div.style.cssText='margin:5px 0;padding:5px;background:#333;border-radius:5px;';
        const rewardText=task.reward.type==='coins'?`${task.reward.amount}修狗币`:'宠物';
        div.innerHTML=`${task.desc} (${Math.min(current,task.target)}/${task.target})<br>奖励:${rewardText}<br>`+(claimed?'<span style="color:green;">已领取</span>':(done?'<button>领取</button>':'<span style="color:gray;">未完成</span>'));
        if(done&&!claimed){div.querySelector('button').addEventListener('click',()=>{claimedTasks[task.id]=true;if(task.reward.type==='coins')dogCoins+=task.reward.amount;else petCount++;updateTaskUI();});}
        container.appendChild(div);
    });
}

function drawOperator(x,y,angle,ch){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle=ch.color;ctx.fillRect(-10,-8,20,20);
    ctx.fillStyle='#f5c6a0';ctx.beginPath();ctx.arc(0,-15,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4a4a4a';ctx.beginPath();ctx.arc(0,-16,11,Math.PI,0);ctx.fill();ctx.fillRect(-11,-18,22,4);
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-3,-15,1.5,0,Math.PI*2);ctx.arc(3,-15,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2c3e50';ctx.save();ctx.rotate(angle);ctx.fillRect(10,-2,20,4);ctx.fillRect(28,-1,4,6);ctx.restore();
    ctx.fillStyle='#fff';ctx.font='8px Arial';ctx.textAlign='center';ctx.fillText(`${player.ammo}/${player.maxAmmo}${player.reloading?'(换弹)':''}`,0,12);
    ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText(ch.name,0,-32);
    ctx.fillStyle='#ff0000';ctx.fillRect(-15,-38,30,4);ctx.fillStyle='#00ff00';ctx.fillRect(-15,-38,30*(player.health/player.maxHealth),4);
    ctx.restore();
}
function drawDog(d){
    ctx.fillStyle=d.frozen?'#87ceeb':'#b5651d';ctx.beginPath();ctx.arc(d.x,d.y,25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(d.x-15,d.y-15);ctx.lineTo(d.x-8,d.y-30);ctx.lineTo(d.x-2,d.y-18);ctx.fill();
    ctx.beginPath();ctx.moveTo(d.x+15,d.y-15);ctx.lineTo(d.x+8,d.y-30);ctx.lineTo(d.x+2,d.y-18);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(d.x-8,d.y-5,4,0,Math.PI*2);ctx.arc(d.x+8,d.y-5,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff0000';ctx.fillRect(d.x-25,d.y-38,50,4);ctx.fillStyle='#00ff00';ctx.fillRect(d.x-25,d.y-38,50*(d.health/d.maxHealth),4);
}
function drawMinimap(){
    const mmX=LOGIC_W-170,mmY=10,mmW=150,mmH=112.5;
    const scaleX=mmW/LOGIC_W,scaleY=mmH/LOGIC_H;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(mmX,mmY,mmW,mmH);
    ctx.strokeStyle='#888';ctx.strokeRect(mmX,mmY,mmW,mmH);
    ctx.fillStyle='rgba(100,100,100,0.8)';
    for(let obs of obstacles){ctx.fillRect(mmX+obs.x*scaleX,mmY+obs.y*scaleY,obs.w*scaleX,obs.h*scaleY);}
    if(exit){ctx.fillStyle='#00ff00';ctx.beginPath();ctx.arc(mmX+exit.x*scaleX,mmY+exit.y*scaleY,3,0,Math.PI*2);ctx.fill();}
    for(let obj of lootableObjects){
        if(obj.opened)continue;
        if(obj.type==='bigSafe'){ctx.fillStyle='#ffd700';ctx.fillRect(mmX+obj.x*scaleX-2,mmY+obj.y*scaleY-2,4,4);}
        if(obj.type==='bossChest'){ctx.fillStyle='#ffaa00';ctx.fillRect(mmX+obj.x*scaleX-2,mmY+obj.y*scaleY-2,4,4);}
    }
    if(boss&&!boss.isDead){
        ctx.strokeStyle='rgba(255,0,0,0.5)';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(mmX+boss.homeX*scaleX,mmY+boss.homeY*scaleY,boss.homeRadius*scaleX,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(mmX+boss.x*scaleX,mmY+boss.y*scaleY,4,0,Math.PI*2);ctx.fill();
    }
    if(player&&player.alive){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mmX+player.x*scaleX,mmY+player.y*scaleY,3,0,Math.PI*2);ctx.fill();}
}

function draw(){
    ctx.clearRect(0,0,LOGIC_W,LOGIC_H);
    if(gameState==='lobby'){drawLobby();return;}
    ctx.fillStyle=getMapTheme(currentMapIndex);ctx.fillRect(0,0,LOGIC_W,LOGIC_H);
    ctx.strokeStyle='#3a3a3a';ctx.lineWidth=1;
    for(let i=0;i<LOGIC_W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,LOGIC_H);ctx.stroke();}
    for(let i=0;i<LOGIC_H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(LOGIC_W,i);ctx.stroke();}
    for(let obs of obstacles){
        if(obs.type==='house'){ctx.fillStyle=obs.color||'#8b5a2b';ctx.fillRect(obs.x,obs.y,obs.w,obs.h);ctx.fillStyle='#5a3a1a';ctx.fillRect(obs.x,obs.y,obs.w,10);}
        else if(obs.type==='wall'){ctx.fillStyle=obs.color||'#666';ctx.fillRect(obs.x,obs.y,obs.w,obs.h);}
        else if(obs.type==='tree'){ctx.fillStyle='#5a3a1a';ctx.fillRect(obs.x+obs.w/2-3,obs.y+obs.h/2,6,obs.h/2);ctx.fillStyle=obs.color||'#2d5a1e';ctx.beginPath();ctx.arc(obs.x+obs.w/2,obs.y+obs.h/2,obs.w/2,0,Math.PI*2);ctx.fill();}
        else if(obs.type==='crate'){ctx.fillStyle=obs.color||'#c4a35a';ctx.fillRect(obs.x,obs.y,obs.w,obs.h);ctx.fillStyle='#8a6a3a';ctx.fillRect(obs.x,obs.y,obs.w,3);}
        else{ctx.fillStyle='#555';ctx.fillRect(obs.x,obs.y,obs.w,obs.h);}
    }
    ctx.fillStyle='#00aa00';ctx.beginPath();ctx.arc(exit.x,exit.y,EXIT_RADIUS,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('撤离点',exit.x,exit.y+5);
    for(let obj of lootableObjects){
        if(obj.opened)continue;
        if(obj.type==='bigSafe'){ctx.fillStyle='#888';ctx.fillRect(obj.x-25,obj.y-20,50,40);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText('大保险',obj.x,obj.y+5);}
        else if(obj.type==='smallSafe'){ctx.fillStyle='#666';ctx.fillRect(obj.x-15,obj.y-15,30,30);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText('小保险',obj.x,obj.y+5);}
        else if(obj.type==='medkit'){ctx.fillStyle='#fff';ctx.fillRect(obj.x-10,obj.y-10,20,20);ctx.fillStyle='#f00';ctx.font='12px Arial';ctx.fillText('+',obj.x,obj.y+4);}
        else if(obj.type==='clothes'){ctx.fillStyle='#4a90d9';ctx.fillRect(obj.x-10,obj.y-10,20,20);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText('衣',obj.x,obj.y+4);}
        else if(obj.type==='bossChest'){ctx.fillStyle='#ffd700';ctx.fillRect(obj.x-30,obj.y-25,60,50);ctx.fillStyle='#000';ctx.font='12px Arial';ctx.fillText('Boss宝箱',obj.x,obj.y+5);}
    }
    for(let smoke of smokeClouds){ctx.fillStyle='rgba(200,200,200,0.5)';ctx.beginPath();ctx.arc(smoke.x,smoke.y,smoke.radius,0,Math.PI*2);ctx.fill();}
    for(let frost of frostZones){ctx.fillStyle='rgba(100,200,255,0.3)';ctx.beginPath();ctx.arc(frost.x,frost.y,frost.radius,0,Math.PI*2);ctx.fill();}
    for(let peel of bananaPeels){ctx.fillStyle='#ffd700';ctx.fillRect(peel.x-8,peel.y-3,16,6);}
    for(let dog of dogs){if(dog.isDead)continue;drawDog(dog);}
    if(boss&&!boss.isDead){
        ctx.fillStyle='rgba(255,0,0,0.1)';ctx.beginPath();ctx.arc(boss.homeX,boss.homeY,boss.homeRadius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,0,0,0.4)';ctx.stroke();
        ctx.fillStyle=boss.frozen?'#87ceeb':'#8b0000';ctx.beginPath();ctx.arc(boss.x,boss.y,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText(boss.name,boss.x,boss.y-45);ctx.fillStyle='#ff0000';ctx.fillRect(boss.x-40,boss.y-50,80,8);ctx.fillStyle='#00ff00';ctx.fillRect(boss.x-40,boss.y-50,80*(boss.health/boss.maxHealth),8);ctx.fillStyle='#666';ctx.fillRect(boss.x+20,boss.y-5,20,4);
    }
    for(let b of bullets){ctx.fillStyle=b.isPlayerBullet?'#0ff':'#ff0';ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();}
    if(player&&player.alive)drawOperator(player.x,player.y,player.angle,characters[player.charIndex]);
    if(clone&&clone.alive){ctx.globalAlpha=0.7;drawOperator(clone.x,clone.y,clone.angle,characters[player.charIndex]);ctx.globalAlpha=1;}
    if(gameState==='playing'||gameState==='reviving'){
        drawMinimap();
        ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='left';
        ctx.fillText(`角色:${characters[player.charIndex].name}`,20,30);ctx.fillText(`击杀:${player.killCount}`,20,55);
        ctx.fillText(`体力:${Math.floor(stamina)}`,20,80);ctx.fillText(`子弹:${player.ammo}/${player.maxAmmo}${player.reloading?'(换弹中)':''}`,20,105);
        ctx.fillText(`技能:${player.skillName}(${skillCooldownTimer>0?Math.ceil(skillCooldownTimer):'就绪'})`,20,130);
        ctx.fillText(`滑铲:${slideCooldown>0?Math.ceil(slideCooldown)+'s':'就绪'}`,20,155);
        let totalValue=0;playerInventory.forEach(item=>{const r=lootRarities.find(r=>r.name===item.type);if(r)totalValue+=r.price*item.amount;});
        ctx.fillText(`背包价值:${totalValue}`,20,180);
        ctx.fillStyle='#ff0';ctx.fillRect(20,190,100*(stamina/maxStamina),8);ctx.strokeStyle='#fff';ctx.strokeRect(20,190,100,8);
    }
    if(gameState==='dead'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,LOGIC_W,LOGIC_H);ctx.fillStyle='#ff3333';ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('你死了',LOGIC_W/2,LOGIC_H/2-40);ctx.font='20px Arial';ctx.fillText('点击屏幕选择复活方式',LOGIC_W/2,LOGIC_H/2+20);}
    else if(gameState==='evacuated'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,LOGIC_W,LOGIC_H);ctx.fillStyle='#00ff00';ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('成功撤离！',LOGIC_W/2,LOGIC_H/2-40);let y=LOGIC_H/2;playerInventory.forEach(item=>{const r=lootRarities.find(r=>r.name===item.type);ctx.fillStyle=r?r.color:'#fff';ctx.font='16px Arial';ctx.fillText(`${item.name||item.type}x${item.amount}`,LOGIC_W/2,y);y+=25;});ctx.fillStyle='#fff';ctx.font='20px Arial';ctx.fillText('点击屏幕返回大厅',LOGIC_W/2,y+30);}
    else if(gameState==='reviving'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,LOGIC_W,LOGIC_H);ctx.fillStyle='#fff';ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText(`广告播放中...${reviveCount}秒`,LOGIC_W/2,LOGIC_H/2);}
}

// ==================== 输入 ====================
window.addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==='Shift')keys['shift']=true;
    if(e.key===' '||e.key==='j')keys['attack']=true;
    if(e.key==='q')keys['skill']=true;
    if(e.key==='e')keys['interact']=true;
    if(e.key==='r'){keys['reload']=true;startReload();}
    if(e.key==='k'){if(slideCooldown<=0&&!isSliding)performSlide();}
    if(e.key==='1')useMedkit('normal');
    if(e.key==='2')useMedkit('super');
    if(e.key==='s'&&gameState==='lobby'){initAudio();settingsModal.style.display='flex';}
    if(gameState==='lobby'){
        if(e.key>='1'&&e.key<='9')equippedSkin=parseInt(e.key)-1;
        else if(e.key==='0')equippedSkin=9;
        else if(e.key==='m')currentMapIndex=(currentMapIndex+1)%11;
        else if(e.key==='Enter')initGame(equippedSkin,currentMapIndex);
    }
});
window.addEventListener('keyup',e=>{
    keys[e.key.toLowerCase()]=false;
    if(e.key==='Shift')keys['shift']=false;
    if(e.key===' '||e.key==='j')keys['attack']=false;
    if(e.key==='q')keys['skill']=false;
    if(e.key==='e')keys['interact']=false;
    if(e.key==='r')keys['reload']=false;
});

canvas.addEventListener('click',e=>{
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(LOGIC_W/rect.width),y=(e.clientY-rect.top)*(LOGIC_H/rect.height);
    if(gameState==='lobby'){
        for(let i=0;i<characters.length;i++){const sx=250+(i%5)*100,sy=260+Math.floor(i/5)*80;if(x>sx-40&&x<sx+40&&y>sy-15&&y<sy+35){equippedSkin=i;break;}}
        if(x>20&&x<140&&y>70&&y<110){signinModal.style.display='flex';updateSigninUI();}
        if(x>20&&x<60&&y>20&&y<50){settingsModal.style.display='flex';}
        if(x>250&&x<350&&y>520&&y<560)upgradeResearch();
        if(x>360&&x<460&&y>520&&y<560){updateCraftInfo();craftModal.style.display='flex';}
        if(x>700&&x<760&&y>20&&y<50){updateTaskUI();taskModal.style.display='flex';}
        for(let i=0;i<10;i++){const my=150+i*35;if(x>550&&x<750&&y>my&&y<my+30){if(i===10){const today=new Date().toDateString();if(specialMapUsedDate===today){alert('今日已进入特殊地图');return;}}currentMapIndex=i;break;}}
        if(x>550&&x<750&&y>500&&y<580){const slot=y<520?'helmet':y<540?'armor':'weapon';const choice=prompt(`1绿(1000) 2蓝(5000) 3黄(20000) 4金(80000) 5红(300000) 6炫彩(500万+5红)`);if(choice){const levels=['绿色','蓝色','黄色','金色','红色'];const idx=parseInt(choice)-1;if(idx>=0&&idx<5)buyLoadout(slot,levels[idx]);else if(idx===5)buyRainbowLoadout(slot);}}
        if(x>300&&x<500&&y>570&&y<600)initGame(equippedSkin,currentMapIndex);
    }
    else if(gameState==='dead')adModal.style.display='flex';
    else if(gameState==='evacuated'){
        taskProgress.totalEvacuations++;
        playerInventory.forEach(item=>{if(item.type==='红色变卖物'||item.type==='大红变卖物'){taskProgress.totalRedExtracted+=item.amount;exhibitionItems.push({...item,layer:Math.floor(Math.random()*3)});}else{const existing=collectedLoot.find(i=>i.type===item.type);if(existing)existing.amount+=item.amount;else collectedLoot.push({...item});}});
        playerInventory=[];gameState='lobby';playBGM();closeAllModals();
    }
});

// 触屏控件
const joyStickBase=document.getElementById('joyStickBase'),joyStickKnob=document.getElementById('joyStickKnob');
const runBtn=document.getElementById('runBtn'),attackBtn=document.getElementById('attackBtn'),skillBtn=document.getElementById('skillBtn');
const interactBtn=document.getElementById('interactBtn'),medkitBtn=document.getElementById('medkitBtn');
const superMedkitBtn=document.getElementById('superMedkitBtn'),slideBtn=document.getElementById('slideBtn'),reloadBtn=document.getElementById('reloadBtn');
joyStickBase.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true;const t=e.touches[0],r=joyStickBase.getBoundingClientRect();joyBasePos={x:r.left+r.width/2,y:r.top+r.height/2};updateJoy(t.clientX,t.clientY);});
document.addEventListener('touchmove',e=>{if(!joyActive)return;for(let t of e.touches){const r=joyStickBase.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<150){updateJoy(t.clientX,t.clientY);break;}}});
document.addEventListener('touchend',e=>{let still=false;for(let t of e.touches){const r=joyStickBase.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<150){still=true;break;}}if(!still){joyActive=false;joyVector={x:0,y:0};joyStickKnob.style.left='65px';joyStickKnob.style.bottom='65px';}});
function updateJoy(cx,cy){const dx=cx-joyBasePos.x,dy=cy-joyBasePos.y,maxDist=45,dist=Math.hypot(dx,dy),clamped=Math.min(dist,maxDist),angle=Math.atan2(dy,dx);joyVector={x:Math.cos(angle)*(clamped/maxDist),y:Math.sin(angle)*(clamped/maxDist)};joyStickKnob.style.left=(65+Math.cos(angle)*clamped)+'px';joyStickKnob.style.bottom=(65-Math.sin(angle)*clamped)+'px';}
runBtn.addEventListener('touchstart',e=>{e.preventDefault();runPressed=true;});runBtn.addEventListener('touchend',e=>{runPressed=false;});
attackBtn.addEventListener('touchstart',e=>{e.preventDefault();attackPressed=true;});attackBtn.addEventListener('touchend',e=>{attackPressed=false;});
skillBtn.addEventListener('touchstart',e=>{e.preventDefault();skillPressed=true;});skillBtn.addEventListener('touchend',e=>{skillPressed=false;});
interactBtn.addEventListener('touchstart',e=>{e.preventDefault();interactPressed=true;});interactBtn.addEventListener('touchend',e=>{interactPressed=false;});
medkitBtn.addEventListener('touchstart',e=>{e.preventDefault();useMedkit('normal');});
superMedkitBtn.addEventListener('touchstart',e=>{e.preventDefault();useMedkit('super');});
slideBtn.addEventListener('touchstart',e=>{e.preventDefault();if(slideCooldown<=0&&!isSliding)performSlide();});
reloadBtn.addEventListener('touchstart',e=>{e.preventDefault();startReload();});

// 按钮事件
document.getElementById('adReviveBtn').onclick=()=>{adModal.style.display='none';reviveCount=5;const iv=setInterval(()=>{reviveCount--;if(reviveCount<=0){clearInterval(iv);player.health=player.maxHealth;player.alive=true;gameState='playing';player.x=80;player.y=520;dogs.forEach(d=>{if(distance(d,player)<150){d.x=Math.random()*700+50;d.y=Math.random()*500+50;}});if(boss&&!boss.isDead&&distance(boss,player)<200){boss.x=Math.random()*700+50;boss.y=Math.random()*500+50;}}},1000);gameState='reviving';};
document.getElementById('adExitBtn').onclick=()=>{adModal.style.display='none';playerInventory=[];gameState='lobby';playBGM();};
document.getElementById('safeSpinBtn').onclick=spinSafeWheel;
document.getElementById('safeCancel').onclick=()=>{safeModal.style.display='none';safeState.active=false;};
document.getElementById('lootTakeAll').onclick=()=>{if(currentInteractTarget&&currentInteractTarget.loot){const items=currentInteractTarget.loot;const newTypes=items.filter(i=>!playerInventory.find(p=>p.type===i.type));if(playerInventory.length+newTypes.length>player.maxInventorySlots){alert('背包空间不足！');}else{items.forEach(i=>addItemToInventory(i));currentInteractTarget.loot=[];}}lootModal.style.display='none';playSearchMusic();};
document.getElementById('lootClose').onclick=()=>{lootModal.style.display='none';};
document.getElementById('medkitConfirmYes').onclick=()=>{if(pendingMedkitType==='normal'&&normalMedkitCount>0){normalMedkitCount--;player.health=Math.min(player.maxHealth,player.health+player.maxHealth*0.15);}else if(pendingMedkitType==='super'&&superMedkitCount>0){superMedkitCount--;player.health=player.maxHealth;}pendingMedkitType=null;medkitConfirmModal.style.display='none';};
document.getElementById('medkitConfirmCancel').onclick=()=>{pendingMedkitType=null;medkitConfirmModal.style.display='none';};
document.getElementById('adGetNormalMedkit').onclick=()=>{adMedkitModal.style.display='none';reviveCount=5;const iv=setInterval(()=>{reviveCount--;if(reviveCount<=0){clearInterval(iv);normalMedkitCount++;gameState='playing';}},1000);gameState='reviving';};
document.getElementById('adGetSuperMedkit').onclick=()=>{adMedkitModal.style.display='none';reviveCount=5;const iv=setInterval(()=>{reviveCount--;if(reviveCount<=0){clearInterval(iv);superMedkitCount++;gameState='playing';}},1000);gameState='reviving';};
document.getElementById('adMedkitCancel').onclick=()=>{adMedkitModal.style.display='none';};
document.getElementById('settingsClose').onclick=()=>{settingsModal.style.display='none';};
document.getElementById('signinClose').onclick=()=>{signinModal.style.display='none';};
document.getElementById('chestClose').onclick=()=>{chestModal.style.display='none';};
document.getElementById('taskCloseBtn').onclick=()=>{taskModal.style.display='none';};
document.getElementById('craftCloseBtn').onclick=()=>{craftModal.style.display='none';};
document.getElementById('craftHelmetBtn').onclick=()=>craftToRainbow('helmet');
document.getElementById('craftArmorBtn').onclick=()=>craftToRainbow('armor');
document.getElementById('craftWeaponBtn').onclick=()=>craftToRainbow('weapon');
document.getElementById('volumeSlider').oninput=e=>{audioSettings.volume=parseInt(e.target.value);document.getElementById('volumeValue').textContent=audioSettings.volume+'%';};
document.getElementById('bgmSlider').oninput=e=>{audioSettings.bgmVolume=parseInt(e.target.value);document.getElementById('bgmValue').textContent=audioSettings.bgmVolume+'%';if(bgmOscillator)playBGM();};
document.getElementById('searchMusicSlider').oninput=e=>{audioSettings.searchMusicVolume=parseInt(e.target.value);document.getElementById('searchMusicValue').textContent=audioSettings.searchMusicVolume+'%';};

function updateCraftInfo(){
    const parts=[];
    for(let slot of['helmet','armor','weapon']){
        const level=equippedLoadout[slot];
        if(level==='炫彩')parts.push(`${slot==='helmet'?'头盔':slot==='armor'?'护甲':'武器'}：已是炫彩`);
        else{const cost=craftCosts[level];parts.push(`${slot==='helmet'?'头盔':slot==='armor'?'护甲':'武器'}：${level}→炫彩(${cost.coins}币+${cost.materialCount}${cost.material})`);}
    }
    document.getElementById('craftInfo').textContent=parts.join('\n');
}

// ==================== 初始化 ====================
characters.forEach((ch,i)=>{if(!characterLevels[i])characterLevels[i]=1;characterSkins[i]=0;skinUnlocked[i]=[true,false,false,false];});
pets.forEach((p,i)=>{if(!petLevels[i])petLevels[i]=1;});

// ==================== 游戏循环与启动 ====================
function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
if(isFirstTime){initGame(equippedSkin,0);isFirstTime=false;}else{gameState='lobby';playBGM();}
gameLoop();
</script>
