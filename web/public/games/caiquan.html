<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>石头剪刀布</title>
<style>
  :root{
    --txt:#e9ebf7;
    --muted:#8f95bd;
    --win:#4ade80;
    --lose:#f87171;
    --draw:#fbbf24;
    --accent:#7c6cff;
    --stroke:rgba(255,255,255,.1);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:20px;
    background:
      radial-gradient(900px 620px at 12% -12%, #262a5c 0%, transparent 62%),
      radial-gradient(820px 620px at 92% 112%, #3a1d5c 0%, transparent 58%),
      #080a14;
    color:var(--txt);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ══════ 容器 ══════ */
  .game{
    width:min(100%,540px);
    padding:26px 24px 22px;
    border-radius:28px;
    background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
    border:1px solid var(--stroke);
    box-shadow:0 30px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    animation:rise .55s cubic-bezier(.2,.8,.25,1);
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(20px) scale(.98)}
    to  {opacity:1;transform:none}
  }

  /* ══════ 头部 ══════ */
  .header{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }

  .title{
    font-size:16px;
    font-weight:800;
    letter-spacing:4px;
    white-space:nowrap;
    background:linear-gradient(90deg,#8b8cff,#5fd4ff 48%,#c084fc);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sound{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    width:34px;height:34px;
    display:grid;place-items:center;
    border-radius:50%;
    border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);
    color:inherit;
    font-size:14px;
    cursor:pointer;
    transition:background .18s, transform .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .sound:hover{background:rgba(255,255,255,.12)}
  .sound:active{transform:translateY(-50%) scale(.9)}
  .sound:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* ══════ 计分板 ══════ */
  .scoreboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:24px;
  }

  .score-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:10px 6px 11px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
  }

  .score-card .label{
    font-size:11px;
    letter-spacing:2px;
    color:var(--muted);
  }

  .score-card .value{
    display:inline-block;
    font-size:26px;
    font-weight:800;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }

  .value.player{color:var(--win)}
  .value.draw  {color:var(--draw)}
  .value.cpu   {color:var(--lose)}

  .value.bump{animation:bump .4s cubic-bezier(.3,1.6,.6,1)}
  @keyframes bump{
    0%  {transform:scale(1)}
    40% {transform:scale(1.38)}
    100%{transform:scale(1)}
  }

  /* ══════ 对战区 ══════ */
  .stage{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    justify-items:center;
    gap:10px;
    margin-bottom:16px;
  }

  .side{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    width:100%;
  }

  .tag{
    font-size:11px;
    letter-spacing:2px;
    color:var(--muted);
  }

  .hand{
    width:clamp(78px,25vw,124px);
    height:clamp(78px,25vw,124px);
    display:grid;
    place-items:center;
    font-size:clamp(34px,11vw,52px);
    line-height:1;
    border-radius:26px;
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.1);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
    color:var(--txt);
    user-select:none;
    transition:border-color .3s,box-shadow .35s,background .3s,opacity .3s,transform .3s,filter .3s;
  }

  .hand.idle{color:#4b5075;font-weight:700}

  .hand.shaking{animation:shake .42s ease-in-out infinite}
  @keyframes shake{
    0%,100%{transform:translateY(0) rotate(0)}
    22%{transform:translateY(-9px) rotate(-8deg)}
    45%{transform:translateY(2px) rotate(0)}
    68%{transform:translateY(-9px) rotate(8deg)}
    90%{transform:translateY(2px) rotate(0)}
  }

  .hand.reveal{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{
    0%  {transform:scale(.5);opacity:.35}
    60% {transform:scale(1.12)}
    100%{transform:scale(1);opacity:1}
  }

  .hand.winner{
    border-color:rgba(74,222,128,.85);
    background:linear-gradient(160deg,rgba(74,222,128,.24),rgba(74,222,128,.05));
    box-shadow:0 0 0 1px rgba(74,222,128,.35),
               0 0 34px -4px rgba(74,222,128,.55),
               inset 0 1px 0 rgba(255,255,255,.1);
    transform:scale(1.05);
  }

  .hand.loser{
    opacity:.36;
    transform:scale(.94);
    filter:grayscale(.4);
  }

  .vs{
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    color:#5c6288;
    transform:translateY(-10px);
  }

  /* ══════ 结果文字 ══════ */
  .verdict{
    min-height:26px;
    margin-bottom:22px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--muted);
    transition:color .25s;
  }
  .verdict.win {color:var(--win)}
  .verdict.lose{color:var(--lose)}
  .verdict.draw{color:var(--draw)}

  /* ══════ 出拳按钮 ══════ */
  .choices{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .choice{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:14px 8px 12px;
    border-radius:18px;
    border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);
    color:inherit;
    font-family:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s cubic-bezier(.2,.8,.25,1),
               background .18s,border-color .18s,box-shadow .18s,opacity .18s;
  }

  .choice .emoji{font-size:28px;line-height:1}
  .choice .name{font-size:13px;letter-spacing:1px;color:var(--muted)}

  .choice:hover:not(:disabled){
    transform:translateY(-4px);
    background:rgba(124,108,255,.2);
    border-color:rgba(124,108,255,.7);
    box-shadow:0 12px 28px -12px rgba(124,108,255,.95);
  }
  .choice:active:not(:disabled){transform:translateY(-1px) scale(.97)}
  .choice:disabled{opacity:.36;cursor:not-allowed}
  .choice:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* ══════ 底部 ══════ */
  .footer{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }

  .reset{
    padding:8px 18px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:#8b91b8;
    font-family:inherit;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    transition:color .18s,background .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .reset:hover{color:#fff;background:rgba(255,255,255,.08)}
  .reset:active{transform:scale(.96)}
  .reset:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .hint{
    font-size:11px;
    letter-spacing:.5px;
    color:#5a5f85;
  }

  /* ══════ 小屏适配 ══════ */
  @media (max-width:420px){
    .game{padding:20px 16px 18px;border-radius:22px}
    .title{font-size:14px;letter-spacing:3px}
    .stage{gap:8px}
    .verdict{font-size:15px}
    .choice{padding:12px 6px 10px;border-radius:15px}
    .choice .emoji{font-size:24px}
    .choice .name{font-size:12px}
    .hand{border-radius:20px}
  }
</style>
</head>
<body>

<main class="game">

  <header class="header">
    <h1 class="title">石头 · 剪刀 · 布</h1>
    <button class="sound" id="soundBtn" type="button" aria-label="关闭音效">🔊</button>
  </header>

  <section class="scoreboard" aria-label="比分">
    <div class="score-card">
      <span class="label">你</span>
      <span class="value player" id="scorePlayer">0</span>
    </div>
    <div class="score-card">
      <span class="label">平局</span>
      <span class="value draw" id="scoreDraw">0</span>
    </div>
    <div class="score-card">
      <span class="label">电脑</span>
      <span class="value cpu" id="scoreCpu">0</span>
    </div>
  </section>

  <section class="stage" aria-label="对战区">
    <div class="side">
      <span class="tag">你</span>
      <div class="hand idle" id="handPlayer">?</div>
    </div>
    <div class="vs">VS</div>
    <div class="side">
      <span class="tag">电脑</span>
      <div class="hand idle" id="handCpu">?</div>
    </div>
  </section>

  <p class="verdict" id="verdict">选择一个手势开始</p>

  <section class="choices" aria-label="出拳">
    <button class="choice" type="button" data-choice="rock">
      <span class="emoji">✊</span><span class="name">石头</span>
    </button>
    <button class="choice" type="button" data-choice="scissors">
      <span class="emoji">✌️</span><span class="name">剪刀</span>
    </button>
    <button class="choice" type="button" data-choice="paper">
      <span class="emoji">✋</span><span class="name">布</span>
    </button>
  </section>

  <footer class="footer">
    <button class="reset" id="resetBtn" type="button">重新开始</button>
    <p class="hint">键盘 1 / 2 / 3 出拳 · R 重开</p>
  </footer>

</main>

<script>
(function () {
  'use strict';

  /* ══════════ 常量 ══════════ */
  const CHOICES = {
    rock:     { emoji: '✊', name: '石头' },
    scissors: { emoji: '✌️', name: '剪刀' },
    paper:    { emoji: '✋', name: '布'   }
  };
  const KEYS    = ['rock', 'scissors', 'paper'];
  const BEATS   = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
  const KEYMAP  = { '1': 'rock', '2': 'scissors', '3': 'paper' };

  /* ══════════ DOM ══════════ */
  const handPlayer  = document.getElementById('handPlayer');
  const handCpu     = document.getElementById('handCpu');
  const verdict     = document.getElementById('verdict');
  const scorePlayer = document.getElementById('scorePlayer');
  const scoreDraw   = document.getElementById('scoreDraw');
  const scoreCpu    = document.getElementById('scoreCpu');
  const buttons     = Array.from(document.querySelectorAll('.choice'));
  const resetBtn    = document.getElementById('resetBtn');
  const soundBtn    = document.getElementById('soundBtn');

  /* ══════════ 状态 ══════════ */
  const state = { player: 0, draw: 0, cpu: 0, streak: 0, locked: false };
  let roundId = 0;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ══════════ 音效引擎 ══════════ */
  let audioCtx = null;
  let soundOn  = true;

  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, dur, opt) {
    if (!soundOn) return;
    const ctx = getCtx();
    if (!ctx) return;

    const o     = opt || {};
    const type  = o.type || 'sine';
    const vol   = o.vol == null ? 0.06 : o.vol;
    const delay = o.delay || 0;
    const t0    = ctx.currentTime + delay;

    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function sfx(name) {
    switch (name) {
      case 'tap':
        beep(880, 0.06, { type: 'square', vol: 0.028 });
        break;
      case 'select':
        beep(480, 0.11, { type: 'triangle', vol: 0.05, to: 680 });
        break;
      case 'reveal':
        beep(700, 0.11, { type: 'triangle', vol: 0.055, to: 940 });
        break;
      case 'win':
        beep(523, 0.16, { type: 'triangle', vol: 0.060 });
        beep(659, 0.16, { type: 'triangle', vol: 0.060, delay: 0.09 });
        beep(784, 0.26, { type: 'triangle', vol: 0.065, delay: 0.18 });
        break;
      case 'lose':
        beep(392, 0.20, { type: 'sine', vol: 0.055 });
        beep(294, 0.30, { type: 'sine', vol: 0.055, delay: 0.13 });
        break;
      case 'draw':
        beep(440, 0.14, { type: 'sine', vol: 0.050 });
        beep(440, 0.18, { type: 'sine', vol: 0.045, delay: 0.14 });
        break;
    }
  }

  function buzz(pattern) {
    if (!navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* 忽略 */ }
  }

  /* ══════════ 界面辅助 ══════════ */
  function setScore(node, value) {
    if (node.textContent === String(value)) return;
    node.textContent = value;
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  }

  function renderScores() {
    setScore(scorePlayer, state.player);
    setScore(scoreDraw,   state.draw);
    setScore(scoreCpu,    state.cpu);
  }

  function setVerdict(text, cls) {
    verdict.textContent = text;
    verdict.className = 'verdict' + (cls ? ' ' + cls : '');
  }

  function setButtonsDisabled(disabled) {
    buttons.forEach((b) => { b.disabled = disabled; });
  }

  function showEmoji(hand, emoji) {
    hand.classList.remove('idle');
    hand.textContent = emoji;
  }

  function resetHands() {
    [handPlayer, handCpu].forEach((h) => {
      h.classList.remove('winner', 'loser', 'reveal', 'shaking');
      h.classList.add('idle');
      h.textContent = '?';
      void h.offsetWidth;
    });
  }

  function clearHandStates() {
    [handPlayer, handCpu].forEach((h) => {
      h.classList.remove('winner', 'loser', 'reveal', 'shaking');
      void h.offsetWidth;
    });
  }

  /* ══════════ 核心：出拳 ══════════ */
  async function play(playerChoice) {
    if (state.locked || !CHOICES[playerChoice]) return;

    state.locked = true;
    setButtonsDisabled(true);

    const id = ++roundId;
    clearHandStates();

    const cpuChoice = KEYS[Math.floor(Math.random() * KEYS.length)];

    setVerdict('石头… 剪刀… 布！', '');
    sfx('select');

    handPlayer.classList.add('shaking');
    handCpu.classList.add('shaking');

    /* 快速闪烁的手势 */
    const flicker = setInterval(() => {
      showEmoji(handPlayer, CHOICES[KEYS[Math.floor(Math.random() * 3)]].emoji);
      showEmoji(handCpu,    CHOICES[KEYS[Math.floor(Math.random() * 3)]].emoji);
    }, 75);

    await sleep(720);
    if (roundId !== id) { clearInterval(flicker); return; }

    clearInterval(flicker);
    handPlayer.classList.remove('shaking');
    handCpu.classList.remove('shaking');

    /* 揭晓 */
    showEmoji(handPlayer, CHOICES[playerChoice].emoji);
    showEmoji(handCpu,    CHOICES[cpuChoice].emoji);
    handPlayer.classList.add('reveal');
    handCpu.classList.add('reveal');
    sfx('reveal');

    /* 判定 */
    let outcome;
    if (playerChoice === cpuChoice)              outcome = 'draw';
    else if (BEATS[playerChoice] === cpuChoice)  outcome = 'win';
    else                                         outcome = 'lose';

    if (outcome === 'win') {
      state.player++;
      state.streak = state.streak > 0 ? state.streak + 1 : 1;

      handPlayer.classList.add('winner');
      handCpu.classList.add('loser');

      let msg = '你赢了！' + CHOICES[playerChoice].name +
                ' 胜过 ' + CHOICES[cpuChoice].name;
      if (state.streak >= 2) msg += '  🔥 ' + state.streak + ' 连胜';
      setVerdict(msg, 'win');

      sfx('win');
      buzz([14, 40, 14]);

    } else if (outcome === 'lose') {
      state.cpu++;
      state.streak = 0;

      handCpu.classList.add('winner');
      handPlayer.classList.add('loser');

      setVerdict('你输了… ' + CHOICES[cpuChoice].name +
                 ' 胜过 ' + CHOICES[playerChoice].name, 'lose');

      sfx('lose');
      buzz(60);

    } else {
      state.draw++;
      state.streak = 0;

      setVerdict('平局！都是' + CHOICES[playerChoice].name, 'draw');

      sfx('draw');
      buzz([10, 30, 10]);
    }

    renderScores();

    await sleep(430);
    [handPlayer, handCpu].forEach((h) => h.classList.remove('reveal'));

    if (roundId !== id) return;
    state.locked = false;
    setButtonsDisabled(false);
  }

  /* ══════════ 重置 ══════════ */
  function reset() {
    roundId++;
    state.player = 0;
    state.draw   = 0;
    state.cpu    = 0;
    state.streak = 0;
    state.locked = false;

    scorePlayer.textContent = '0';
    scoreDraw.textContent   = '0';
    scoreCpu.textContent    = '0';
    [scorePlayer, scoreDraw, scoreCpu].forEach((n) => n.classList.remove('bump'));

    resetHands();
    setVerdict('选择一个手势开始', '');
    setButtonsDisabled(false);
    sfx('tap');
  }

  /* ══════════ 事件绑定 ══════════ */
  buttons.forEach((btn) => {
    btn.addEventListener('click', () => play(btn.dataset.choice));
  });

  resetBtn.addEventListener('click', reset);

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-label', soundOn ? '关闭音效' : '开启音效');
    if (soundOn) sfx('tap');
  });

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;

    const choice = KEYMAP[e.key];
    if (choice) { e.preventDefault(); play(choice); return; }

    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  });

  /* ══════════ 初始化 ══════════ */
  resetHands();
  renderScores();

})();
</script>
</body>
</html>
