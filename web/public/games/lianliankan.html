<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>连连看 · 水果消消乐</title>
<style>
  :root { --accent: #ffd166; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% -10%, #2b2350 0%, #120f22 45%, #08060f 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #ece9ff;
    overflow: hidden;
    user-select: none;
  }

  .app { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px; }

  /* ---------- 顶部信息栏 ---------- */
  .hud { display: flex; gap: 10px; }
  .stat {
    display: flex; align-items: baseline; gap: 6px;
    padding: 6px 15px; border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(8px);
  }
  .stat .k { font-size: 12px; color: #a49dd0; letter-spacing: .05em; }
  .stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }

  /* ---------- 棋盘 ---------- */
  .board {
    position: relative;
    box-sizing: content-box;
    border-radius: 18px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 60px rgba(120,100,255,.06);
  }

  .link-layer {
    position: absolute; left: 0; top: 0;
    pointer-events: none; z-index: 5; overflow: visible;
  }
  .link-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(255,209,102,.9));
    animation: lineFade .5s ease-out forwards;
  }
  @keyframes lineFade {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- 牌 ---------- */
  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(255,255,255,.17), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
    cursor: pointer;
    line-height: 1;
    z-index: 2;
    transition: transform .12s ease, box-shadow .15s, border-color .15s, background .15s;
    will-change: transform;
  }
  @media (hover: hover) {
    .tile:hover {
      transform: translateY(-2px);
      border-color: rgba(255,209,102,.55);
      box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);
    }
  }
  .tile.selected {
    background: linear-gradient(160deg, rgba(255,209,102,.55), rgba(255,143,171,.28));
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,209,102,.65), 0 0 24px rgba(255,209,102,.45);
    transform: translateY(-2px) scale(1.05);
  }
  .tile.hint {
    border-color: #7be0ff;
    animation: hintPulse .7s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(123,224,255,.75), inset 0 1px 0 rgba(255,255,255,.2); }
    50%     { box-shadow: 0 0 0 5px rgba(123,224,255,.12), 0 0 28px rgba(123,224,255,.7); }
  }
  .tile.shake { animation: shake .32s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-5px); }
    75%     { transform: translateX(5px); }
  }
  .tile.vanish {
    animation: vanish .28s ease-in forwards;
    pointer-events: none;
  }
  @keyframes vanish {
    from { transform: scale(1) rotate(0); opacity: 1; }
    to   { transform: scale(.25) rotate(14deg); opacity: 0; }
  }

  /* ---------- 按钮 ---------- */
  .controls { display: flex; gap: 10px; }
  button {
    font: inherit; font-size: 14px;
    padding: 9px 20px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.07);
    color: #e8e5ff; cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.26); }
  button:active { transform: scale(.95); }

  #muteBtn { padding: 9px 14px; min-width: 46px; }

  /* ---------- 提示条 ---------- */
  .toast {
    position: fixed; left: 50%; top: 26px;
    transform: translate(-50%, -18px);
    padding: 10px 22px; border-radius: 999px;
    background: rgba(255,209,102,.96);
    color: #241a33; font-weight: 700; font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 100; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 通关面板 ---------- */
  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(8,6,16,.76);
    backdrop-filter: blur(7px);
    z-index: 50;
  }
  .overlay.show { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    text-align: center;
    padding: 34px 48px;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(62,52,112,.96), rgba(25,20,50,.96));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 80px rgba(0,0,0,.65);
    animation: pop .35s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 16px; font-size: 26px; letter-spacing: .04em; }
  .panel p { margin: 6px 0; color: #b9b2e0; font-size: 15px; }
  .panel strong { color: var(--accent); font-size: 21px; margin-left: 4px; }
  .panel button {
    margin-top: 22px; padding: 12px 32px;
    background: linear-gradient(135deg, #ffd166, #ff8fab);
    color: #241a33; font-weight: 700; border: none;
  }
  .panel button:hover { filter: brightness(1.08); background: linear-gradient(135deg, #ffd166, #ff8fab); }
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div class="stat"><span class="k">得分</span><span class="v" id="score">0</span></div>
    <div class="stat"><span class="k">剩余</span><span class="v" id="remain">80</span></div>
    <div class="stat"><span class="k">用时</span><span class="v" id="time">00:00</span></div>
  </div>

  <div class="board" id="board">
    <svg class="link-layer" id="linkLayer" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button id="hintBtn">💡 提示</button>
    <button id="shuffleBtn">🔀 重排</button>
    <button id="restartBtn">🔄 重开</button>
    <button id="muteBtn" title="音效开关">🔊</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>🎉 全部消除！</h2>
    <p>用时<strong id="finalTime">00:00</strong></p>
    <p>得分<strong id="finalScore">0</strong></p>
    <button id="playAgain">再来一局</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     配置
     ========================================================= */
  const ROWS = 8;
  const COLS = 10;
  const ICONS = ['🍎','🍊','🍇','🍉','🍓','🍒','🥝','🍍','🥥','🍑','🍋','🍌','🥕','🌽','🍄','🍆'];
  const TYPE_COUNT = 12;

  /* =========================================================
     DOM
     ========================================================= */
  const boardEl   = document.getElementById('board');
  const svgEl     = document.getElementById('linkLayer');
  const scoreEl   = document.getElementById('score');
  const remainEl  = document.getElementById('remain');
  const timeEl    = document.getElementById('time');
  const overlayEl = document.getElementById('overlay');
  const finalTimeEl  = document.getElementById('finalTime');
  const finalScoreEl = document.getElementById('finalScore');
  const muteBtn   = document.getElementById('muteBtn');

  /* =========================================================
     音效引擎（Web Audio，无需外部文件）
     ========================================================= */
  const Sound = (function () {
    let ctx = null;
    let master = null;
    let enabled = true;

    function ensure() {
      if (!enabled) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!ctx) {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    /**
     * 播放一个音符
     * opt: { f0, f1, dur, type, vol, delay }
     */
    function tone(opt) {
      const c = ensure();
      if (!c) return;
      const t0 = c.currentTime + (opt.delay || 0);
      const dur = opt.dur || 0.12;

      const osc = c.createOscillator();
      const gain = c.createGain();

      osc.type = opt.type || 'sine';
      osc.frequency.setValueAtTime(opt.f0, t0);
      if (opt.f1) {
        osc.frequency.exponentialRampToValueAtTime(opt.f1, t0 + dur);
      }

      const vol = opt.vol == null ? 0.25 : opt.vol;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(gain);
      gain.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    }

    return {
      /* 解锁音频上下文（需在用户手势中调用） */
      unlock: function () { ensure(); },

      isOn: function () { return enabled; },

      toggle: function () {
        enabled = !enabled;
        if (enabled) ensure();
        return enabled;
      },

      /* 选中一张牌 */
      select: function () {
        tone({ f0: 700, dur: 0.09, type: 'sine', vol: 0.22 });
      },

      /* 取消选中 */
      deselect: function () {
        tone({ f0: 480, f1: 340, dur: 0.1, type: 'sine', vol: 0.16 });
      },

      /* 切换选中目标 */
      switchSel: function () {
        tone({ f0: 620, dur: 0.07, type: 'sine', vol: 0.16 });
      },

      /* 消除成功：上行三音琶音 */
      match: function () {
        tone({ f0: 660,  dur: 0.11, type: 'sine', vol: 0.26, delay: 0.00 });
        tone({ f0: 880,  dur: 0.11, type: 'sine', vol: 0.24, delay: 0.07 });
        tone({ f0: 1320, dur: 0.18, type: 'sine', vol: 0.20, delay: 0.14 });
      },

      /* 连接失败 */
      error: function () {
        tone({ f0: 220, f1: 110, dur: 0.24, type: 'triangle', vol: 0.28 });
      },

      /* 提示 */
      hint: function () {
        tone({ f0: 980,  dur: 0.10, type: 'sine', vol: 0.18, delay: 0.00 });
        tone({ f0: 1310, dur: 0.14, type: 'sine', vol: 0.15, delay: 0.09 });
      },

      /* 重排 */
      shuffle: function () {
        tone({ f0: 300, f1: 980, dur: 0.34, type: 'sine', vol: 0.20 });
        tone({ f0: 500, f1: 1200, dur: 0.30, type: 'triangle', vol: 0.10, delay: 0.05 });
      },

      /* 开局 */
      start: function () {
        tone({ f0: 523, dur: 0.10, type: 'sine', vol: 0.20, delay: 0.00 });
        tone({ f0: 784, dur: 0.16, type: 'sine', vol: 0.18, delay: 0.09 });
      },

      /* 通关胜利 */
      win: function () {
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach(function (f, i) {
          tone({ f0: f, dur: 0.30, type: 'sine', vol: 0.24, delay: i * 0.11 });
          tone({ f0: f * 2, dur: 0.22, type: 'sine', vol: 0.08, delay: i * 0.11 });
        });
        tone({ f0: 1046.5, dur: 0.55, type: 'sine', vol: 0.20, delay: 0.62 });
        tone({ f0: 1568.0, dur: 0.60, type: 'sine', vol: 0.14, delay: 0.62 });
      }
    };
  })();

  /* =========================================================
     状态
     ========================================================= */
  let cell = 44, pad = 22, gap = 3;
  let tileEls = [];          // tileEls[r][c] -> element | null
  let grid = [];             // grid[r][c] -> type index | null （含外圈）
  let selected = null;       // {r, c}
  let score = 0;
  let remaining = 0;
  let startTime = 0;
  let timerId = null;
  let running = false;

  /* =========================================================
     工具
     ========================================================= */
  function shuffleArr(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  const cx = c => pad + (c - 1) * cell + cell / 2;
  const cy = r => pad + (r - 1) * cell + cell / 2;

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  /* =========================================================
     布局
     ========================================================= */
  function placeTile(el, r, c) {
    const size = cell - gap * 2;
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
    el.style.left   = (pad + (c - 1) * cell + gap) + 'px';
    el.style.top    = (pad + (r - 1) * cell + gap) + 'px';
    el.style.fontSize    = Math.round(size * 0.58) + 'px';
    el.style.borderRadius = Math.round(cell * 0.2) + 'px';
  }

  function layout() {
    const availW = Math.max(window.innerWidth - 16, 260);
    const availH = Math.max(window.innerHeight - 180, 260);

    cell = Math.floor(Math.min(availW / (COLS + 1), availH / (ROWS + 1)));
    cell = Math.max(cell, 24);
    pad  = cell / 2;
    gap  = Math.max(2, Math.round(cell * 0.055));

    const w = (COLS + 1) * cell;
    const h = (ROWS + 1) * cell;

    boardEl.style.width  = w + 'px';
    boardEl.style.height = h + 'px';

    svgEl.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svgEl.style.width  = w + 'px';
    svgEl.style.height = h + 'px';

    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= COLS; c++) {
        const el = tileEls[r] && tileEls[r][c];
        if (el) placeTile(el, r, c);
      }
    }
  }

  /* =========================================================
     连通性判定
     ========================================================= */
  function isFree(r, c) {
    if (r < 0 || r > ROWS + 1 || c < 0 || c > COLS + 1) return false;
    return grid[r][c] === null;
  }

  function clearH(r, c1, c2) {
    const lo = Math.min(c1, c2), hi = Math.max(c1, c2);
    for (let c = lo + 1; c < hi; c++) if (!isFree(r, c)) return false;
    return true;
  }

  function clearV(c, r1, r2) {
    const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
    for (let r = lo + 1; r < hi; r++) if (!isFree(r, c)) return false;
    return true;
  }

  /**
   * 寻找 a -> b 的合法路径（最多两个拐点）
   * 返回点数组 [a, ...拐点, b]，或 null
   */
  function findPath(a, b) {
    // ---- 0 拐：直线 ----
    if (a.r === b.r && clearH(a.r, a.c, b.c)) return [a, b];
    if (a.c === b.c && clearV(a.c, a.r, b.r)) return [a, b];

    // ---- 1 拐：L 型 ----
    const p1 = { r: a.r, c: b.c };
    if (isFree(p1.r, p1.c) && clearH(a.r, a.c, b.c) && clearV(b.c, a.r, b.r)) {
      return [a, p1, b];
    }
    const p2 = { r: b.r, c: a.c };
    if (isFree(p2.r, p2.c) && clearV(a.c, a.r, b.r) && clearH(b.r, a.c, b.c)) {
      return [a, p2, b];
    }

    // ---- 2 拐：沿 a 所在行横向扫描 ----
    for (let c = 0; c <= COLS + 1; c++) {
      if (c === a.c) continue;
      if (!isFree(a.r, c)) continue;
      if (!clearH(a.r, a.c, c)) continue;
      if (isFree(b.r, c) && clearV(c, a.r, b.r) && clearH(b.r, c, b.c)) {
        return [a, { r: a.r, c: c }, { r: b.r, c: c }, b];
      }
    }

    // ---- 2 拐：沿 a 所在列纵向扫描 ----
    for (let r = 0; r <= ROWS + 1; r++) {
      if (r === a.r) continue;
      if (!isFree(r, a.c)) continue;
      if (!clearV(a.c, a.r, r)) continue;
      if (isFree(r, b.c) && clearH(r, a.c, b.c) && clearV(b.c, r, b.r)) {
        return [a, { r: r, c: a.c }, { r: r, c: b.c }, b];
      }
    }

    return null;
  }

  /** 在场上寻找任意一对可消除的牌 */
  function findAnyPair() {
    const cells = [];
    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= COLS; c++) {
        if (grid[r][c] !== null) cells.push({ r: r, c: c, v: grid[r][c] });
      }
    }
    for (let i = 0; i < cells.length; i++) {
      for (let j = i + 1; j < cells.length; j++) {
        if (cells[i].v !== cells[j].v) continue;
        if (findPath(cells[i], cells[j])) return [cells[i], cells[j]];
      }
    }
    return null;
  }

  /* =========================================================
     建局
     ========================================================= */
  function buildBoard() {
    const pairs = (ROWS * COLS) / 2;
    let tries = 0;

    do {
      const vals = [];
      for (let i = 0; i < pairs; i++) {
        const t = i % TYPE_COUNT;
        vals.push(t, t);
      }
      shuffleArr(vals);

      grid = [];
      for (let r = 0; r <= ROWS + 1; r++) grid.push(new Array(COLS + 2).fill(null));

      let k = 0;
      for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
          grid[r][c] = vals[k++];
        }
      }
      tries++;
    } while (!findAnyPair() && tries < 40);
  }

  function renderBoard() {
    // 清理旧牌
    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= COLS; c++) {
        const el = tileEls[r] && tileEls[r][c];
        if (el) el.remove();
      }
    }

    tileEls = [];
    for (let r = 0; r <= ROWS + 1; r++) tileEls.push(new Array(COLS + 2).fill(null));

    const frag = document.createDocumentFragment();
    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= COLS; c++) {
        const v = grid[r][c];
        if (v === null) continue;

        const el = document.createElement('div');
        el.className = 'tile';
        el.textContent = ICONS[v];
        placeTile(el, r, c);
        el.addEventListener('click', (function (rr, cc) {
          return function () { handleClick(rr, cc); };
        })(r, c));

        frag.appendChild(el);
        tileEls[r][c] = el;
      }
    }
    boardEl.appendChild(frag);
  }

  /* =========================================================
     交互
     ========================================================= */
  function handleClick(r, c) {
    if (!running) return;
    Sound.unlock();

    const v = grid[r][c];
    if (v === null) return;
    const el = tileEls[r][c];
    if (!el) return;

    // 再次点击取消选中
    if (selected && selected.r === r && selected.c === c) {
      el.classList.remove('selected');
      selected = null;
      Sound.deselect();
      return;
    }

    // 首次选中
    if (!selected) {
      selected = { r: r, c: c };
      el.classList.add('selected');
      Sound.select();
      return;
    }

    const a = selected;
    const elA = tileEls[a.r][a.c];

    // 图案不同 → 切换选中
    if (grid[a.r][a.c] !== v) {
      if (elA) elA.classList.remove('selected');
      selected = { r: r, c: c };
      el.classList.add('selected');
      Sound.switchSel();
      return;
    }

    // 图案相同 → 判断能否连通
    const path = findPath(a, { r: r, c: c });
    if (!path) {
      bump(elA);
      bump(el);
      Sound.error();
      if (elA) elA.classList.remove('selected');
      selected = { r: r, c: c };
      el.classList.add('selected');
      return;
    }

    /* ---- 消除 ---- */
    if (elA) elA.classList.remove('selected');
    selected = null;

    grid[a.r][a.c] = null;
    grid[r][c] = null;
    tileEls[a.r][a.c] = null;
    tileEls[r][c] = null;

    drawPath(path);
    Sound.match();

    if (elA) elA.classList.add('vanish');
    el.classList.add('vanish');
    window.setTimeout(function () {
      if (elA) elA.remove();
      el.remove();
    }, 300);

    remaining -= 2;
    score += 10;
    updateHUD();

    if (remaining === 0) {
      endGame();
    } else {
      window.setTimeout(checkDeadlock, 340);
    }
  }

  function drawPath(points) {
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('points', points.map(function (p) {
      return cx(p.c) + ',' + cy(p.r);
    }).join(' '));
    poly.setAttribute('class', 'link-line');
    svgEl.appendChild(poly);
    window.setTimeout(function () { poly.remove(); }, 520);
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    window.setTimeout(function () { el.classList.remove('shake'); }, 350);
  }

  /* =========================================================
     死局 / 重排
     ========================================================= */
  function checkDeadlock() {
    if (!running || remaining === 0) return;
    if (!findAnyPair()) {
      toast('没有可消除的组合，自动重排！');
      doShuffle(true);
    }
  }

  function doShuffle(silent) {
    const positions = [];
    const values = [];

    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= COLS; c++) {
        if (grid[r][c] !== null) {
          positions.push({ r: r, c: c });
          values.push(grid[r][c]);
        }
      }
    }
    if (positions.length === 0) return;

    // 洗到有解为止
    let tries = 0;
    do {
      shuffleArr(values);
      for (let i = 0; i < positions.length; i++) {
        grid[positions[i].r][positions[i].c] = values[i];
      }
      tries++;
    } while (!findAnyPair() && tries < 60);

    if (!silent) Sound.shuffle();

    // 清除选中
    if (selected) {
      const sel = tileEls[selected.r] && tileEls[selected.r][selected.c];
      if (sel) sel.classList.remove('selected');
      selected = null;
    }

    // 更新 DOM + 动画
    for (let i = 0; i < positions.length; i++) {
      const p = positions[i];
      const el = tileEls[p.r][p.c];
      if (!el) continue;
      el.textContent = ICONS[values[i]];
      if (el.animate) {
        el.animate(
          [
            { transform: 'scale(1)',    opacity: 1 },
            { transform: 'scale(0.55)', opacity: 0.25 },
            { transform: 'scale(1)',    opacity: 1 }
          ],
          { duration: 320, delay: Math.min(i * 2, 200), easing: 'ease-out' }
        );
      }
    }
  }

  /* =========================================================
     计时 / HUD / 通关
     ========================================================= */
  function updateHUD() {
    scoreEl.textContent = score;
    remainEl.textContent = remaining;
  }

  function startTimer() {
    startTime = Date.now();
    running = true;
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      if (!running) return;
      timeEl.textContent = fmt(Math.floor((Date.now() - startTime) / 1000));
    }, 200);
  }

  function endGame() {
    running = false;
    clearInterval(timerId);
    const t = Math.floor((Date.now() - startTime) / 1000);
    finalTimeEl.textContent = fmt(t);
    finalScoreEl.textContent = score;
    overlayEl.classList.add('show');
    Sound.win();
  }

  function newGame() {
    overlayEl.classList.remove('show');
    running = false;
    clearInterval(timerId);

    selected = null;
    score = 0;
    remaining = ROWS * COLS;
    updateHUD();
    timeEl.textContent = '00:00';

    buildBoard();
    renderBoard();
    startTimer();
    Sound.start();
  }

  /* =========================================================
     Toast
     ========================================================= */
  let toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* =========================================================
     按钮事件
     ========================================================= */
  document.getElementById('hintBtn').addEventListener('click', function () {
    if (!running) return;
    Sound.unlock();
    const pair = findAnyPair();
    if (!pair) { doShuffle(); return; }

    Sound.hint();
    pair.forEach(function (p) {
      const el = tileEls[p.r][p.c];
      if (!el) return;
      el.classList.remove('hint');
      void el.offsetWidth;
      el.classList.add('hint');
      window.setTimeout(function () { el.classList.remove('hint'); }, 2200);
    });
  });

  document.getElementById('shuffleBtn').addEventListener('click', function () {
    if (!running) return;
    Sound.unlock();
    doShuffle();
  });

  document.getElementById('restartBtn').addEventListener('click', function () {
    Sound.unlock();
    newGame();
  });

  document.getElementById('playAgain').addEventListener('click', function () {
    Sound.unlock();
    newGame();
  });

  muteBtn.addEventListener('click', function () {
    const on = Sound.toggle();
    muteBtn.textContent = on ? '🔊' : '🔇';
    if (on) Sound.select();   // 开启时给个反馈音
  });

  /* =========================================================
     窗口自适应
     ========================================================= */
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });

  /* =========================================================
     启动
     ========================================================= */
  layout();
  newGame();

})();
</script>
</body>
</html>
